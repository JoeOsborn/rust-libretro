[package]
name = "gisst-rust-libretro-sys"
version.workspace = true
edition.workspace = true
authors = [ "Maximilian Mader", "Joe Osborn" ]
description = "libretro API bindings generated via bindgen"
keywords = [ "libretro", "RetroArch", "emulator", "game", "bindgen" ]
categories = [ "external-ffi-bindings", "emulators", "game-development", "gui" ]
readme = "README.md"
license = "MIT"
documentation = "https://docs.rs/gisst-rust-libretro-sys/"
repository.workspace = true

[features]
vulkan = ["dep:ash"]

[dependencies]
ash = { version = "0.37.2", optional = true }
gisst-rust-libretro-sys-proc = { path = "./rust-libretro-sys-proc", version = "0.4.0"}

[build-dependencies]
bindgen = "0.73.2"
