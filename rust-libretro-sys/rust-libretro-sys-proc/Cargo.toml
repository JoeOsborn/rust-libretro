[package]
name = "gisst-rust-libretro-sys-proc"
version.workspace = true
edition.workspace = true
authors = [ "Maximilian Mader", "Joe Osborn" ]
description = "Procedural macros for gisst-rust-libretro-sys"
keywords = [ "libretro", "RetroArch", "emulator", "game" ]
categories = [ "emulators", "game-development", "gui" ]
readme = "README.md"
license = "MIT"
documentation = "https://docs.rs/gisst-rust-libretro-proc-sys/"
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace=true, features = [ "extra-traits", "full", "parsing" ] }
