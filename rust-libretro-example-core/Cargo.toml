[package]
name = "gisst-rust-libretro-example-core"
version.workspace = true
edition.workspace = true
authors = [ "Maximilian Mader", "Joe Osborn" ]
description = "libretro example core"
keywords = [ "libretro", "RetroArch", "emulator", "game", "bindgen" ]
categories = [ "api-bindings", "emulators", "game-development", "gui", "games" ]
readme = "README.md"
license = "MIT"
documentation = "https://docs.rs/gisst-rust-libretro-example-core/"
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
log = "0.4.17"

[dependencies.gisst-rust-libretro]
path = "../rust-libretro"
features = [ "log", "unstable-env-commands" ]

[dev-dependencies]
log = { version = "0.4.17", features = ["release_max_level_debug"] }
