[workspace]
resolver = "3"

members = [
	"rust-libretro-sys",
	"rust-libretro",
	"rust-libretro-example-core",
]

default-members = [
	"rust-libretro"
]

[workspace.package]
version = "0.4.2"
edition = "2024"
repository = "https://github.com/joeosborn/rust-libretro/"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
incremental = false
codegen-units = 8
rpath = false

[workspace.dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version="3.0", features = [ "extra-traits", "full", "parsing" ] }
